site_name: Planned DF Strategies
site_description: Strategies and thoughts on playing Dwarf Fortress

theme:
  name: material
  features:
    - navigation.instant
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
